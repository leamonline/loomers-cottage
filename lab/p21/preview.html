<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loomer's Lab P2.1</title><style>body{margin:0}</style><script>// P2.1.0 candidate. Fixture-only. No hass access, network or device actions.
(() => {
const routes=['Home','Climate','Energy','Mokka','Security','Entertainment','Routines','Learning & insights','Home Health','Settings','History & analytics'];
const keys=['home','climate','energy','mokka','security','entertainment','routines','learning-insights','home-health','settings','history-analytics'];
const glyphs=['⌂','♨','ϟ','◇','⬡','♫','◷','✧','♡','⚙','⌁'];
const roomNames=['Living Room','Kitchen','Bedroom','Bathroom','Landing','Garden'];
const roomGlyphs=['▱','▤','▰','♧','▥','♧'];
const base={phase:'day',season:'autumn',weather:'Cloudy',temp:'8°C',indoor:'20.2°C',humidity:'54%',heat:'Idle',power:'350 W',rate:'38.3 p/kWh',battery:'82%',range:'176 mi',contact:'Closed',lock:'Locked',smoke:'Clear',guest:'Off',owner:'Home',ev:false,vent:false,doorbell:false,age:12,unknownEvent:false};
const fixtures={morning:{...base,label:'Routine morning',greeting:'Good morning',phase:'dawn'},charging:{...base,label:'Charging and humid bathroom',greeting:'Good evening',phase:'night',weather:'Rain',temp:'5°C',power:'7.3 kW',rate:'6.5 p/kWh',battery:'62%',range:'135 mi',ev:true,vent:true},security:{...base,label:'Unknown security',greeting:'Good afternoon',lock:'Unavailable',doorbell:true,unknownEvent:true},stale:{...base,label:'Stale vehicle data',greeting:'Good afternoon',age:7200},away:{...base,label:'Away with uncertain occupancy',greeting:'Good afternoon',owner:'Away',guest:'On · source unconfirmed'},winter:{...base,label:'Winter night',greeting:'Good evening',season:'winter',phase:'night',weather:'Snow',temp:'−2°C',heat:'Active'},smoke:{...base,label:'Smoke alert fixture',greeting:'Good afternoon',smoke:'Detected'}};
const isStale=s=>s.age>3600;
function events(s){return [...(s.smoke==='Detected'?[{rank:0,title:'Smoke detected',why:'Synthetic smoke detector reports detected',target:4}]:[]),...(s.lock==='Unavailable'?[{rank:1,title:'Security status incomplete',why:'Front lock source unavailable',target:4}]:[]),...(s.vent?[{rank:2,title:'Bathroom ventilation recommended',why:'Fixture humidity 78%',target:1}]:[]),...(s.doorbell?[{rank:2,title:'Doorbell event reported',why:'Synthetic doorbell signal',target:4}]:[]),...(s.ev?[{rank:3,title:'Charging active',why:'Fixture EV power 7.0 kW; smart dispatch active',target:2}]:[]),...(isStale(s)?[{rank:4,title:'Vehicle reading stale',why:'Last known battery and range, 2 hours old',target:3}]:[]),...(s.unknownEvent?[{rank:4,title:'Event monitoring incomplete',why:'One or more event sources unavailable',target:4}]:[])].sort((a,b)=>a.rank-b.rank)}
const css=`:host{display:block;color:#343e34;font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ink:#343e34;--muted:#4d6049;--paper:#f1ede3;--panel:#e6e8dc;--edge:#c4ccbb;--accent:#63745d;--glass:#f1ede3e8;--bg:#d8d1c1;--warn:#80501f;--critical:#962b32;--active:#42603e;color-scheme:light}*{box-sizing:border-box}button,select,input{font:inherit;color:inherit}button,select{min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{border:1px solid var(--edge);background:var(--paper);border-radius:12px;padding:8px 12px}button[aria-current=page]{background:var(--panel);font-weight:700}h1{font:400 clamp(2rem,5vw,3.5rem)/1.1 Georgia,serif;margin:.25em 0}h2{font-size:1rem;margin:0 0 8px}p{margin:0}small,.muted{color:var(--muted)}.shell{min-height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr);background:linear-gradient(145deg,var(--bg),var(--panel));color:var(--ink)}.shell[data-phase=dawn]{--bg:#e4d5bb}.shell[data-weather=Rain]{--bg:#bac9c4}.shell[data-season=winter]{--bg:#d5ded9}.shell[data-phase=night]{--bg:#bec9bc}.shell[data-static=true]{--bg:#d8d1c1}.sidebar{position:sticky;top:0;height:100dvh;overflow:auto;padding:16px 10px;background:var(--glass);border-right:1px solid var(--edge)}.brand{font-weight:700;padding:12px 5px}.nav{display:grid;gap:4px}.nav button,.dock button{text-align:left;border:0;background:transparent}.nav button[aria-current=page],.dock button[aria-current=page]{background:var(--panel)}.main{max-width:1450px;width:100%;margin:auto;align-self:start;padding:28px clamp(12px,3vw,44px) 80px}.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.tile{border:1px solid var(--edge);border-radius:20px;background:var(--paper);padding:16px;min-width:0;box-shadow:0 4px 14px #273c2510}.tile button{width:100%;text-align:left;border:0;padding:0;background:transparent}.tile[data-category="0"]{--category:#365e81}.tile[data-category="1"]{--category:#87542c}.tile[data-category="2"]{--category:#705e17}.tile[data-category="3"]{--category:#365e81}.tile[data-category="4"]{--category:#42603e}.tile h2{color:var(--category,var(--ink))}.tile .value{font-size:clamp(1.35rem,2.5vw,2rem);font-weight:550;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.line{margin-top:5px;font-size:.88rem;overflow-wrap:anywhere;color:var(--muted)}.reason{min-height:2.7em;margin-top:8px;font-size:.8rem;color:var(--muted)}.warn{color:var(--warn);font-weight:650}.critical{color:var(--critical);font-weight:750}.glyph{display:inline-block;color:var(--accent);margin-right:6px}.active .glyph{background:var(--panel);border-radius:6px;padding:0 4px}.section{margin-top:16px}.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rooms button{text-align:left;overflow-wrap:anywhere}.dock,.collapse{display:none}.brief{margin:12px 0 18px}.brief button{margin-top:8px}.event{padding:8px 0;border-bottom:1px solid var(--edge)}dialog{width:min(92%,560px);max-height:85dvh;overflow:auto;border:1px solid var(--edge);border-radius:24px;background:var(--glass);color:var(--ink);padding:20px;box-shadow:0 15px 60px #142a3240}dialog::backdrop{background:#142a3266}dialog[open]{animation:enter .3s cubic-bezier(.2,.9,.35,1.08)}@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.settings label{display:flex;gap:8px;align-items:center;min-height:44px}.settings input{width:20px;height:20px}.status{min-height:1.4em}.skip{position:absolute;left:-10000px}.skip:focus{left:12px;top:12px;z-index:10;background:var(--paper);padding:10px}.more{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(min-width:600px) and (max-width:1023px){.shell{grid-template-columns:170px minmax(0,1fr)}.collapse{display:block}.shell[data-compact=true]{grid-template-columns:56px minmax(0,1fr)}.shell[data-compact=true] .nav button{font-size:0}.shell[data-compact=true] .nav .glyph{font-size:18px}.shell[data-compact=true] .brand{display:none}.grid,.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:599px){.shell{display:block}.sidebar{display:none}.main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}.grid,.rooms{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px;border-radius:16px}.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;z-index:3;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96%,480px);padding:4px;background:var(--glass);border:1px solid var(--edge);border-radius:22px;box-shadow:0 6px 24px #142a3230}.dock button{font-size:.7rem;text-align:center;padding:4px;min-width:0}.dock .glyph{display:block;margin:0;font-size:1.1rem}.desktop-only{display:none}}@media(max-width:345px){.grid,.rooms{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:host{--ink:#e8ede2;--muted:#c0cdb9;--paper:#263c32;--panel:#3b5145;--edge:#536859;--accent:#a2b19a;--glass:#182b24eb;--bg:#182b24;--warn:#f2c595;--critical:#ffb2b5;--active:#c3dfb9;color-scheme:dark}.tile[data-category="0"],.tile[data-category="3"]{--category:#b8d5ec}.tile[data-category="1"]{--category:#e3bc93}.tile[data-category="2"]{--category:#e8d594}.tile[data-category="4"]{--category:#b4d0aa}.shell[data-phase=dawn]{--bg:#3e4031}.shell[data-weather=Rain]{--bg:#203c39}.shell[data-season=winter]{--bg:#20342f}.shell[data-phase=night],.shell[data-static=true]{--bg:#182b24}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(prefers-reduced-transparency:reduce){:host{--glass:var(--paper)}}`;
const el=(tag,txt='',cls='')=>{const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x};
class Preview extends HTMLElement{
 constructor(){super();this.attachShadow({mode:'open'});this.route=0;this.scenario='morning';this.prefs={adaptive:true,atmosphere:true,focus:true};this.origin=null;this.review='';this.shadowRoot.append(el('style',css));this.shell=el('div','','shell');this.shadowRoot.append(this.shell);this.side=el('aside','','sidebar');this.side.append(el('div','Loomer’s Cottage','brand'));const collapse=this.btn('☰',()=>{const c=this.shell.dataset.compact!=='true';this.shell.dataset.compact=String(c);collapse.setAttribute('aria-expanded',String(!c))},'collapse');collapse.setAttribute('aria-label','Toggle sidebar');collapse.setAttribute('aria-expanded','true');this.side.append(collapse);this.nav=el('nav','','nav');this.nav.setAttribute('aria-label','Destinations');routes.forEach((_,i)=>this.nav.append(this.navButton(i)));this.side.append(this.nav);this.main=el('main','','main');this.main.id='main';const top=el('div','','top');top.append(el('strong','LOOMER’S LAB · SYNTHETIC DATA'));this.select=el('select');this.select.setAttribute('aria-label','Lab scenario');Object.entries(fixtures).forEach(([k,s])=>this.select.add(new Option(s.label,k)));this.select.addEventListener('change',()=>{this.scenario=this.select.value;this.render()});top.append(this.select);this.content=el('div');this.main.append(top,this.content);this.dock=el('nav','','dock');this.dock.setAttribute('aria-label','Quick navigation');for(let i=0;i<4;i++)this.dock.append(this.navButton(i));this.dock.append(this.btn('⋯ More',e=>this.more(e.currentTarget)));this.dialog=el('dialog');this.dialog.setAttribute('aria-labelledby','dialog-title');this.dialog.addEventListener('close',()=>{const o=this.origin;this.origin=null;if(o?.isConnected)o.focus()});this.shell.append(this.side,this.main,this.dock,this.dialog);this.render()}
 setConfig(){/* Configuration intentionally ignored: fixture-only. */}getCardSize(){return 12}
 btn(t,f,c=''){const b=el('button',t,c);b.type='button';b.addEventListener('click',f);return b}
 navButton(i){const b=this.btn('',()=>this.go(i));b.dataset.route=keys[i];b.setAttribute('aria-label',routes[i]);b.append(el('span',glyphs[i],'glyph'),el('span',routes[i]));return b}
 go(i){if(!Number.isInteger(i)||i<0||i>=routes.length)return;if(this.dialog.open){this.origin=null;this.dialog.close()}this.route=i;this.render();this.content.querySelector('h1').focus()}
 modal(title,lines,origin,target){this.origin=origin;const h=el('h2',title);h.id='dialog-title';this.dialog.replaceChildren(h,...lines.map(x=>el('p',x,'line')));const a=el('div','','actions');if(target!==undefined)a.append(this.btn('Open '+routes[target],()=>this.go(target)));a.append(this.btn('Close',()=>this.dialog.close()));this.dialog.append(a);this.dialog.showModal();a.lastChild.focus()}
 more(origin){this.origin=origin;const h=el('h2','More destinations');h.id='dialog-title';const g=el('div','','more');for(let i=4;i<routes.length;i++)g.append(this.navButton(i));this.dialog.replaceChildren(h,g,this.btn('Close',()=>this.dialog.close()));this.dialog.showModal();g.firstChild.focus()}
 cards(s){return [[0,'Weather',s.temp,[s.weather,'Sunrise 07:49 · Sunset 16:02'],''],[1,'Comfort',s.indoor,[s.humidity+' humidity','Heating '+s.heat],s.vent?'Bathroom ventilation recommended':''],[2,'Energy',s.power,[s.rate,'Today’s cost · Awaiting data'],s.ev?'Smart dispatch active · EV 7.0 kW':''],[4,'Security',s.lock==='Unavailable'?'Status incomplete':s.smoke==='Detected'?'Smoke detected':'Doors reported locked',['Front lock · '+s.lock,'Contacts closed · Smoke '+s.smoke],s.lock==='Unavailable'?'Lock source unavailable':s.smoke==='Detected'?'Critical fixture alert':''],[3,'Mokka',s.battery,[s.range,'Last known age · '+(isStale(s)?'2 hours':'12 seconds')],isStale(s)?'Stale vehicle telemetry':s.ev?'Charging':''],[6,'Upcoming routines','Wind-down',['21:30 · lighting schedule'],''],[5,'Entertainment','Nothing playing',['Three room audio sources'],''],[8,'Home Health','Backup complete',['Fixture · 05:11'],''],[6,'Occupancy',s.owner,['Guest mode · '+s.guest],s.owner==='Away'&&s.guest!=='Off'?'Occupancy uncertain':'']]}
 tile(x,s){const [i,label,value,lines,reason]=x;const a=el('article','','tile'+(reason?' active':''));a.dataset.category=String(i);const b=this.btn('',()=>this.modal(label,[value,...lines,reason||'No additional event in this fixture','Source: synthetic fixture · rule: deterministic'],b,i));b.append(el('h2',glyphs[i]+' '+label),el('p',value,'value'));lines.forEach(l=>b.append(el('p',l,'line')));b.append(el('p',reason||' ','reason'+(reason?' warn':'')+(s.smoke==='Detected'&&i===4?' critical':'')));a.append(b);return a}
 home(s){const section=el('section','','brief');const es=events(s);section.append(el('p',this.prefs.adaptive&&this.prefs.focus?(es[0]?.title||'No active event reported by fixture sources.'):'Household overview · presentation paused','muted'));const b=this.btn('Household briefing',()=>this.modal('Household briefing',[s.weather+' · '+s.temp,...es.map(e=>e.title+': '+e.why),es.length?'Source: synthetic scenario':'No active event reported by these fixture sources.'],b));section.append(b);const grid=el('div','','grid');this.cards(s).forEach(x=>grid.append(this.tile(x,s)));const rooms=el('section','','tile section');rooms.append(el('h2','Rooms'));const rg=el('div','','rooms');const conditions=[s.indoor+' · Lights off','20.9°C · Washer idle','19.4°C · Blinds closed',s.vent?'21°C · 78% · Ventilation recommended':'21°C · 56% · Extractor off','Temperature unavailable · Activity clear',s.temp+' forecast · Motion clear'];roomNames.forEach((name,i)=>{const r=this.btn('',()=>this.modal(name,[conditions[i],'Controls not connected in Lab','Fixture only'],r,i===3?1:0));r.append(el('strong',roomGlyphs[i]+' '+name),el('p',conditions[i],'line'));rg.append(r)});rooms.append(rg);const now=el('section','','tile section');now.setAttribute('aria-label','Right Now');now.append(el('h2','Right Now'));if(es.length)es.forEach(e=>{const b=this.btn(e.title,()=>this.modal(e.title,[e.why,'Source: synthetic fixture'],b,e.target));b.className='event';now.append(b)});else now.append(el('p','No active event reported by fixture sources.','muted'));return [section,grid,rooms,now]}
 detail(s){if(this.route===9){const a=el('section','','tile settings');a.append(el('h2','Session preferences · not synchronised'));for(const [key,name] of [['adaptive','Adaptive presentation'],['atmosphere','Environmental backgrounds'],['focus','Predictive focus']]){const l=el('label'),c=el('input');c.type='checkbox';c.checked=this.prefs[key];c.addEventListener('change',()=>{this.prefs[key]=c.checked;this.applyAtmosphere()});l.append(c,document.createTextNode(name));a.append(l)}a.append(this.btn('Restore defaults',()=>{this.prefs={adaptive:true,atmosphere:true,focus:true};this.render()}));return [a]}const matches=this.cards(s).filter(x=>x[0]===this.route);const a=el('section','','tile section');a.append(el('h2',routes[this.route]),el('p',this.route===7?'No validated live recommendations. Review workflow requires L1 approval.':this.route===10?'Historical comparisons and forecasts await verified data.':this.route===4?'Camera streaming and sensitive controls are not connected in Lab.':this.route===1?'Temperature controls and warm-up estimates require later validation.':'Read-only fixture detail; live controls are not connected.','line'));if(this.route===7){const status=el('p',this.review||'Synthetic recommendation: evening lighting pattern · 18 of 21 eligible observations.','status');for(const t of ['Review','Correct','Dismiss'])a.append(this.btn(t,()=>{this.review='Fixture response: '+t+' · no live changes';status.textContent=this.review}));a.append(status)}a.append(this.btn('Back to Home',()=>this.go(0)));return [...matches.map(x=>this.tile(x,s)),a]}
 applyAtmosphere(){const s=fixtures[this.scenario];this.shell.dataset.static=String(!this.prefs.atmosphere||!this.prefs.adaptive);this.shell.dataset.phase=s.phase;this.shell.dataset.weather=s.weather;this.shell.dataset.season=s.season;if(this.shell.dataset.static==='true'){this.shell.dataset.phase='day';this.shell.dataset.weather='Cloudy';this.shell.dataset.season='neutral'}}
 render(){const s=fixtures[this.scenario];this.applyAtmosphere();const h=el('h1',this.route===0?s.greeting+'.':routes[this.route]);h.tabIndex=-1;this.content.replaceChildren(h,el('p','Synthetic scenario · '+s.label,'muted'),...(this.route===0?this.home(s):this.detail(s)));this.shadowRoot.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-current',b.dataset.route===keys[this.route]?'page':'false'))}
}
if(!customElements.get('loomers-lab-p21'))customElements.define('loomers-lab-p21',Preview);
})();
