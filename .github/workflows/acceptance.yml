name: Fixture acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check tracked files, decisions, checksum, and syntax
        run: python3 tests/check-repository.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Replay the original P2.1 acceptance assertions
        run: |
          python3 -m venv "$RUNNER_TEMP/p21-venv"
          "$RUNNER_TEMP/p21-venv/bin/python" -m pip install -r tests/p21/requirements.txt
          "$RUNNER_TEMP/p21-venv/bin/python" tests/p21/acceptance.py
      - name: Run supplemental browser regression tests
        run: npm test
